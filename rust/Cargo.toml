[package]
name = "dixbase-payments"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "Official DixBase SDK for hosted checkout payments and signed webhooks."
license = "MIT"
repository = "https://github.com/dixsoftware/sdk"
homepage = "https://github.com/dixsoftware/sdk#readme"
readme = "README.md"
keywords = ["dixbase", "payments", "checkout", "webhooks", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

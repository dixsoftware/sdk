name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/*
      - run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  nuget:
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    defaults:
      run:
        working-directory: dotnet/DixBase.Payments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet pack --configuration Release --no-build --output ./nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: dotnet/DixBase.Payments/nupkg/*.nupkg
      - run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        if: ${{ env.NUGET_API_KEY != '' }}

  ruby:
    runs-on: ubuntu-latest
    env:
      RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: gem build dixbase_payments.gemspec
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-gem
          path: ruby/*.gem
      - run: mkdir -p ~/.gem && printf -- "---\n:rubygems_api_key: $RUBYGEMS_API_KEY\n" > ~/.gem/credentials && chmod 0600 ~/.gem/credentials && gem push *.gem
        if: ${{ env.RUBYGEMS_API_KEY != '' }}

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: java-package
          path: java/target/*.jar

  woocommerce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd plugins/woocommerce && zip -r dixbase-payments-for-woocommerce.zip dixbase-payments-for-woocommerce
      - uses: actions/upload-artifact@v4
        with:
          name: woocommerce-plugin
          path: plugins/woocommerce/dixbase-payments-for-woocommerce.zip

  github-release:
    runs-on: ubuntu-latest
    needs: [npm, pypi, nuget, ruby, java, woocommerce]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            openapi/openapi.yaml
            postman/dixbase-business-api.postman_collection.json
            release-artifacts/**/*.whl
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.nupkg
            release-artifacts/**/*.gem
            release-artifacts/**/*.jar
            release-artifacts/**/*.zip
